<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Aden Farah - Contact</title>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Syne:wght@700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />

  <style>
    /* ── CONTACT PAGE STYLES ── */

    .page-wrapper {
      padding-top: 68px;
    }

    #contact {
      padding: 80px 60px;
    }

    /* Center the form on the page */
    .contact-container {
      max-width: 680px;
      margin: 0 auto;
      text-align: center;
    }

    .contact-description {
      color: var(--text-muted);
      font-size: 1rem;
      margin-bottom: 48px;
      line-height: 1.8;
    }

    /* The form itself */
    .contact-form {
      display: flex;
      flex-direction: column;
      gap: 16px;
      text-align: left;
    }

    /* Two fields side by side (name + email) */
    .form-row {
      display: flex;
      gap: 16px;
    }

    .form-row .form-field {
      flex: 1;
    }

    /* A single input group (label + field) */
    .form-field {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .form-field label {
      font-size: 0.82rem;
      font-weight: 500;
      color: var(--text-muted);
      letter-spacing: 0.03em;
    }

    /* Shared styles for text inputs and textarea */
    .form-field input,
    .form-field textarea {
      background: var(--dark-card);
      border: 1px solid var(--dark-border);
      border-radius: 10px;
      padding: 13px 16px;
      color: var(--text-main);
      font-family: 'Inter', sans-serif;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
      resize: vertical;
    }

    /* Blue ring when user clicks into a field */
    .form-field input:focus,
    .form-field textarea:focus {
      border-color: var(--blue-main);
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
    }

    .form-field textarea {
      min-height: 140px;
    }

    /* Send button */
    .send-btn {
      background: var(--blue-main);
      color: #fff;
      border: none;
      padding: 14px 32px;
      border-radius: 10px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      align-self: flex-start;
      transition: background 0.2s, box-shadow 0.2s, transform 0.15s;
    }

    .send-btn:hover {
      background: var(--blue-light);
      box-shadow: 0 0 28px var(--blue-glow);
      transform: translateY(-1px);
    }

    @media (max-width: 768px) {
      #contact {
        padding: 60px 24px;
      }

      .form-row {
        flex-direction: column;
      }
    }
  </style>
</head>
<body>

  <canvas id="bgCanvas"></canvas>

  <!-- ── NAVBAR ── -->
  <nav class="navbar">
    <a href="index.html" class="navbar-logo">Aden F.</a>

    <ul class="navbar-links">
      <li><a href="index.html">Home</a></li>
      <li><a href="about.html">About</a></li>
      <li><a href="project.html">Projects</a></li>
      <li><a href="about.html">CV</a></li>
      <li><a href="contact.html" class="active">Contact</a></li>
    </ul>

    <a href="contact.html" class="navbar-btn">Hire me</a>
  </nav>

  <div class="page-wrapper">
    <section id="contact">
      <div class="contact-container">

        <h2 class="section-heading show-on-scroll">Get in touch</h2>

        <p class="contact-description show-on-scroll">
          Have a project in mind, want to collaborate, or just want to say hi?
          I'd love to hear from you.
        </p>

        <!-- Contact form -->
        <form class="contact-form show-on-scroll" onsubmit="handleFormSubmit(event)">

          <!-- Name and email on the same row -->
          <div class="form-row">
            <div class="form-field">
              <label for="nameInput">Name</label>
              <input type="text" id="nameInput" placeholder="Your name" required />
            </div>

            <div class="form-field">
              <label for="emailInput">Email</label>
              <input type="email" id="emailInput" placeholder="your@email.com" required />
            </div>
          </div>

          <div class="form-field">
            <label for="subjectInput">Subject</label>
            <input type="text" id="subjectInput" placeholder="What's it about?" />
          </div>

          <div class="form-field">
            <label for="messageInput">Message</label>
            <textarea id="messageInput" placeholder="Tell me about your project..."></textarea>
          </div>

          <button type="submit" class="send-btn" id="sendButton">Send message →</button>
        </form>

      </div>
    </section>
  </div>

  <!-- ── FOOTER ── -->
  <footer class="site-footer">
    <p>Built by <span>Aden Farah</span> · © 2025</p>

    <div class="footer-links">

  <script>
    // =============================================
    // BACKGROUND ANIMATION
    // =============================================

    const myCanvas = document.getElementById('bgCanvas');
    const pen = myCanvas.getContext('2d');
    const blueColor = [37, 99, 235];
    let canvasW, canvasH, dotList = [];
    const NUM_DOTS = 90;
    const CONNECT_DISTANCE = 160;
    let arcDrawProgress = 0;

    function resizeCanvas() {
      canvasW = myCanvas.width = window.innerWidth;
      canvasH = myCanvas.height = window.innerHeight;
    }

    function randomBetween(min, max) {
      return Math.random() * (max - min) + min;
    }

    function createDots() {
      dotList = [];
      for (let i = 0; i < NUM_DOTS; i++) {
        dotList.push({
          x: randomBetween(0, canvasW),
          y: randomBetween(0, canvasH),
          speedX: randomBetween(-0.25, 0.25),
          speedY: randomBetween(-0.25, 0.25),
          size: randomBetween(1, 2.5),
          opacity: randomBetween(0.2, 0.7),
          pulseAngle: randomBetween(0, Math.PI * 2),
          pulseSpeed: randomBetween(0.005, 0.02)
        });
      }
    }

    function drawCurvedLines() {
      arcDrawProgress = Math.min(arcDrawProgress + 0.003, 1);
      const numSteps = Math.floor(arcDrawProgress * 120);
      pen.save();
      pen.lineWidth = 1.2;
      pen.setLineDash([]);
      pen.strokeStyle = `rgba(${blueColor.join(',')}, 0.25)`;
      pen.beginPath();
      for (let i = 0; i <= numSteps; i++) {
        const t = i / 120;
        const x = (1-t)*(1-t)*0 + 2*(1-t)*t*(canvasW*0.05) + t*t*(canvasW*0.85);
        const y = (1-t)*(1-t)*(canvasH*0.55) + 2*(1-t)*t*(canvasH*0.05) + t*t*0;
        i === 0 ? pen.moveTo(x, y) : pen.lineTo(x, y);
      }
      pen.stroke();
      pen.strokeStyle = `rgba(${blueColor.join(',')}, 0.1)`;
      pen.beginPath();
      for (let i = 0; i <= numSteps; i++) {
        const t = i / 120;
        const x = (1-t)*(1-t)*canvasW + 2*(1-t)*t*(canvasW*0.6) + t*t*(canvasW*0.3);
        const y = (1-t)*(1-t)*(canvasH*0.8) + 2*(1-t)*t*(canvasH*0.5) + t*t*canvasH;
        i === 0 ? pen.moveTo(x, y) : pen.lineTo(x, y);
      }
      pen.stroke();
      pen.restore();
    }

    function drawFrame() {
      pen.clearRect(0, 0, canvasW, canvasH);
      drawCurvedLines();
      for (let dot of dotList) {
        dot.x += dot.speedX;
        dot.y += dot.speedY;
        dot.pulseAngle += dot.pulseSpeed;
        const currentOpacity = dot.opacity * (0.7 + 0.3 * Math.sin(dot.pulseAngle));
        if (dot.x < -10) dot.x = canvasW + 10;
        if (dot.x > canvasW + 10) dot.x = -10;
        if (dot.y < -10) dot.y = canvasH + 10;
        if (dot.y > canvasH + 10) dot.y = -10;
        pen.beginPath();
        pen.arc(dot.x, dot.y, dot.size, 0, Math.PI * 2);
        pen.fillStyle = `rgba(${blueColor.join(',')}, ${currentOpacity})`;
        pen.fill();
      }
      for (let i = 0; i < dotList.length; i++) {
        for (let j = i + 1; j < dotList.length; j++) {
          const dx = dotList[i].x - dotList[j].x;
          const dy = dotList[i].y - dotList[j].y;
          const distance = Math.sqrt(dx * dx + dy * dy);
          if (distance < CONNECT_DISTANCE) {
            const lineOpacity = (1 - distance / CONNECT_DISTANCE) * 0.15;
            pen.beginPath();
            pen.moveTo(dotList[i].x, dotList[i].y);
            pen.lineTo(dotList[j].x, dotList[j].y);
            pen.strokeStyle = `rgba(${blueColor.join(',')}, ${lineOpacity})`;
            pen.lineWidth = 0.7;
            pen.stroke();
          }
        }
      }
      requestAnimationFrame(drawFrame);
    }

    window.addEventListener('resize', () => { resizeCanvas(); createDots(); });
    resizeCanvas();
    createDots();
    drawFrame();

    // =============================================
    // CONTACT FORM SUBMIT
    // Show a success message when the form is sent
    // =============================================

    function handleFormSubmit(event) {
      // Stop the page from refreshing
      event.preventDefault();

      const sendButton = document.getElementById('sendButton');

      // Change button to show it was sent
      sendButton.textContent = 'Sent ✓';
      sendButton.style.background = '#16a34a';

      // Reset everything after 3 seconds
      setTimeout(function() {
        sendButton.textContent = 'Send message →';
        sendButton.style.background = '';
        event.target.reset();
      }, 3000);
    }

    // =============================================
    // SCROLL ANIMATIONS
    // =============================================

    const scrollWatcher = new IntersectionObserver(function(entries) {
      entries.forEach(function(entry) {
        if (entry.isIntersecting) {
          entry.target.classList.add('visible');
        }
      });
    }, { threshold: 0.1 });

    document.querySelectorAll('.show-on-scroll').forEach(function(el) {
      scrollWatcher.observe(el);
    });
  </script>
</body>
</html>
