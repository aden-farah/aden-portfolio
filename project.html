<!DOCTYPE html>
<html lang="en">
<head>

  <link rel="stylesheet" href="style.css" />

  <style>
    /* ── PROJECTS PAGE STYLES ── */

    .page-wrapper {
      padding-top: 68px;
    }

    #projects {
      padding: 80px 60px;
    }

    /* Grid layout for the project cards */
    .projects-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 24px;
      max-width: 1100px;
      margin: 0 auto;
    }

    /* Each project card */
    .project-card {
      background: var(--dark-card);
      border: 1px solid var(--dark-border);
      border-radius: 16px;
      padding: 32px;
      transition: border-color 0.2s, transform 0.2s, box-shadow 0.2s;
    }

    .project-card:hover {
      border-color: var(--blue-main);
      transform: translateY(-4px);
      box-shadow: 0 12px 40px rgba(37, 99, 235, 0.14);
    }

    /* Small uppercase label like "Full Stack" */
    .project-type {
      font-size: 0.72rem;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--blue-light);
      margin-bottom: 14px;
    }

    .project-name {
      font-family: 'Syne', sans-serif;
      font-size: 1.2rem;
      font-weight: 700;
      color: var(--white);
      margin-bottom: 12px;
    }

    .project-description {
      font-size: 0.9rem;
      color: var(--text-muted);
      line-height: 1.7;
      margin-bottom: 24px;
    }

    .project-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 20px;
    }

    /* Small pill for each technology used */
    .tag-pill {
      background: rgba(37, 99, 235, 0.08);
      border: 1px solid rgba(37, 99, 235, 0.2);
      color: var(--blue-light);
      font-size: 0.75rem;
      font-weight: 500;
      padding: 3px 10px;
      border-radius: 6px;
    }

    /* Link to view the project on GitHub */
    .project-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.85rem;
      color: var(--text-muted);
      text-decoration: none;
      transition: color 0.2s;
    }

    .project-link:hover {
      color: var(--blue-light);
    }

    @media (max-width: 768px) {
      #projects {
        padding: 60px 24px;
      }
    }
  </style>
</head>
<body>

  <canvas id="bgCanvas"></canvas>

  <!-- ── NAVBAR ── -->

  <script>
    // =============================================
    // BACKGROUND ANIMATION
    // =============================================

    const myCanvas = document.getElementById('bgCanvas');
    const pen = myCanvas.getContext('2d');
    const blueColor = [37, 99, 235];
    let canvasW, canvasH, dotList = [];
    const NUM_DOTS = 90;
    const CONNECT_DISTANCE = 160;
    let arcDrawProgress = 0;

    function resizeCanvas() {
      canvasW = myCanvas.width = window.innerWidth;
      canvasH = myCanvas.height = window.innerHeight;
    }

    function randomBetween(min, max) {
      return Math.random() * (max - min) + min;
    }

    function createDots() {
      dotList = [];
      for (let i = 0; i < NUM_DOTS; i++) {
        dotList.push({
          x: randomBetween(0, canvasW),
          y: randomBetween(0, canvasH),
          speedX: randomBetween(-0.25, 0.25),
          speedY: randomBetween(-0.25, 0.25),
          size: randomBetween(1, 2.5),
          opacity: randomBetween(0.2, 0.7),
          pulseAngle: randomBetween(0, Math.PI * 2),
          pulseSpeed: randomBetween(0.005, 0.02)
        });
      }
    }

    function drawCurvedLines() {
      arcDrawProgress = Math.min(arcDrawProgress + 0.003, 1);
      const numSteps = Math.floor(arcDrawProgress * 120);
      pen.save();
      pen.lineWidth = 1.2;
      pen.setLineDash([]);
      pen.strokeStyle = `rgba(${blueColor.join(',')}, 0.25)`;
      pen.beginPath();
      for (let i = 0; i <= numSteps; i++) {
        const t = i / 120;
        const x = (1-t)*(1-t)*0 + 2*(1-t)*t*(canvasW*0.05) + t*t*(canvasW*0.85);
        const y = (1-t)*(1-t)*(canvasH*0.55) + 2*(1-t)*t*(canvasH*0.05) + t*t*0;
        i === 0 ? pen.moveTo(x, y) : pen.lineTo(x, y);
      }
      pen.stroke();
      pen.strokeStyle = `rgba(${blueColor.join(',')}, 0.1)`;
      pen.beginPath();
      for (let i = 0; i <= numSteps; i++) {
        const t = i / 120;
        const x = (1-t)*(1-t)*canvasW + 2*(1-t)*t*(canvasW*0.6) + t*t*(canvasW*0.3);
        const y = (1-t)*(1-t)*(canvasH*0.8) + 2*(1-t)*t*(canvasH*0.5) + t*t*canvasH;
        i === 0 ? pen.moveTo(x, y) : pen.lineTo(x, y);
      }
      pen.stroke();
      pen.restore();
    }

    function drawFrame() {
      pen.clearRect(0, 0, canvasW, canvasH);
      drawCurvedLines();
      for (let dot of dotList) {
        dot.x += dot.speedX;
        dot.y += dot.speedY;
        dot.pulseAngle += dot.pulseSpeed;
        const currentOpacity = dot.opacity * (0.7 + 0.3 * Math.sin(dot.pulseAngle));
        if (dot.x < -10) dot.x = canvasW + 10;
        if (dot.x > canvasW + 10) dot.x = -10;
        if (dot.y < -10) dot.y = canvasH + 10;
        if (dot.y > canvasH + 10) dot.y = -10;
        pen.beginPath();
        pen.arc(dot.x, dot.y, dot.size, 0, Math.PI * 2);
        pen.fillStyle = `rgba(${blueColor.join(',')}, ${currentOpacity})`;
        pen.fill();
      }
      for (let i = 0; i < dotList.length; i++) {
        for (let j = i + 1; j < dotList.length; j++) {
          const dx = dotList[i].x - dotList[j].x;
          const dy = dotList[i].y - dotList[j].y;
          const distance = Math.sqrt(dx * dx + dy * dy);
          if (distance < CONNECT_DISTANCE) {
            const lineOpacity = (1 - distance / CONNECT_DISTANCE) * 0.15;
            pen.beginPath();
            pen.moveTo(dotList[i].x, dotList[i].y);
            pen.lineTo(dotList[j].x, dotList[j].y);
            pen.strokeStyle = `rgba(${blueColor.join(',')}, ${lineOpacity})`;
            pen.lineWidth = 0.7;
            pen.stroke();
          }
        }
      }
      requestAnimationFrame(drawFrame);
    }

    window.addEventListener('resize', () => { resizeCanvas(); createDots(); });
    resizeCanvas();
    createDots();
    drawFrame();

    // =============================================
    // PROJECT CARDS
    // Add your real projects here - just fill in
    // the title, description, tech and github link
    // =============================================

    const myProjects = [
      {
        type: 'Full Stack',
        title: 'Project One',
        description: 'A description of your first project. What it does, what problem it solves, and how you built it.',
        techUsed: ['React', 'Node.js', 'MongoDB'],
        githubLink: 'https://github.com/'
      },
      {
        type: 'Backend',
        title: 'Project Two',
        description: 'A description of your second project. Highlight the architecture and key technical decisions.',
        techUsed: ['C#', '.NET', 'SQL'],
        githubLink: 'https://github.com/'
      },
      {
        type: 'API',
        title: 'Project Three',
        description: 'A description of your third project. Focus on what makes it unique and valuable.',
        techUsed: ['Python', 'FastAPI', 'Docker'],
        githubLink: 'https://github.com/'
      }
    ];

    const grid = document.getElementById('projectsGrid');

    myProjects.forEach(function(project, index) {
      const card = document.createElement('div');
      card.className = 'project-card show-on-scroll';
      card.style.transitionDelay = (index * 0.1) + 's';

      const tagPills = project.techUsed.map(function(tech) {
        return `<span class="tag-pill">${tech}</span>`;
      }).join('');

      card.innerHTML = `
        <div class="project-type">${project.type}</div>
        <div class="project-name">${project.title}</div>
        <div class="project-description">${project.description}</div>
        <div class="project-tags">${tagPills}</div>
        <a href="${project.githubLink}" target="_blank" class="project-link">View on GitHub →</a>
      `;

      grid.appendChild(card);
    });

    // =============================================
    // SCROLL ANIMATIONS
    // =============================================

    const scrollWatcher = new IntersectionObserver(function(entries) {
      entries.forEach(function(entry) {
        if (entry.isIntersecting) {
          entry.target.classList.add('visible');
        }
      });
    }, { threshold: 0.1 });

    document.querySelectorAll('.show-on-scroll').forEach(function(el) {
      scrollWatcher.observe(el);
    });
  </script>
